name: Release container

on:
  # Manual runs must select a v-prefixed tag ref.
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is what `gh release create` needs; the image push
      # still only needs `packages: write`.
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish image from the tagged source
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache,mode=max

      # The GitHub Release is part of the release, not an extra: every product
      # cut from this template publishes one for every tag, so a listener can
      # act on the release notification. A tag that already has a Release
      # (a re-run of this workflow) is left as it is rather than failed.
      - name: Resolve the published image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" \
            --format '{{ json .Manifest.Digest }}' | tr -d '"')
          echo "image=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Image: \`${{ steps.digest.outputs.image }}\`"
