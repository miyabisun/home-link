[package]
name = "home-link"
version = "0.1.49"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
aes = "0.8.4"
axum = "0.8.9"
cmac = "0.7.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
include_dir = "0.7.4"
mime_guess = "2.0.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
