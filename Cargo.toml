[package]
name = "home-link"
version = "0.1.9"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
